name: Jules

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Task description for Jules (it will analyze the repo and open a PR)"
        required: true
        type: string
      branch:
        description: "Optional: branch for Jules to start from (defaults to the repo's default branch)"
        required: false
        type: string

jobs:
  invoke-jules:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Invoke Jules
        uses: google-labs-code/jules-invoke@v1.0.0
        with:
          prompt: |
            ${{ inputs.task }}
          starting_branch: ${{ inputs.branch || 'main' }}
          jules_api_key: ${{ secrets.JULES_API_KEY }}
