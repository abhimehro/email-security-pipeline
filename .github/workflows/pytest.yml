name: Pytest

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    name: Verify requirements sync

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check pytest pin consistency
        run: |
          pytest_ci=$(grep "^pytest" requirements-ci.txt)
          pytest_dev=$(grep "^pytest" requirements-dev.txt)
          
          if [ "$pytest_ci" != "$pytest_dev" ]; then
            echo "❌ pytest versions differ across requirements files:"
            echo "  requirements-ci.txt:  $pytest_ci"
            echo "  requirements-dev.txt: $pytest_dev"
            echo ""
            echo "Keep both files in sync. Edit one, then update the other."
            exit 1
          fi
          
          echo "✅ pytest pin consistent: $pytest_ci"

  pytest:
    runs-on: ubuntu-latest
    needs: sync-check

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Run tests
        run: |
          python -m pytest
