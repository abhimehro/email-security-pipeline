name: Summarize new issues

on:
  issues:
    types: [opened]

jobs:
  summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      models: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare prompt
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf "Summarize the following GitHub issue in one paragraph:\nTitle: %s\nBody: %s\n" "$ISSUE_TITLE" "$ISSUE_BODY" > prompt.txt

      # NOTE: ai-inference@v3 dropped GitHub Models and shells out to Copilot
      # CLI, which is not on hosted runners (issue #1474 / personal-config #2042).
      # Pin v2.1.1 — same working path as ctrld-sync — until Copilot CLI +
      # COPILOT_GITHUB_TOKEN is an explicit product choice.
      - name: Run AI inference
        id: inference
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          prompt-file: prompt.txt

      - name: Comment with AI summary
        run: |
          printf "%s\n" "$RESPONSE" > response.txt
          gh issue comment --body-file response.txt -- "$ISSUE_NUMBER"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          RESPONSE: ${{ steps.inference.outputs.response }}
