# https://docs.devin.ai/onboard-devin/environment-yaml

# Bootstrap a working pip for Python 3.12+ (the system pip may be too old
# for the distutils-less interpreter). `ensurepip` bootstraps pip, then we
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  python3 -m ensurepip --upgrade
  python3 -m pip install --user --upgrade pip

# Install CI/dev dependencies. This intentionally uses requirements-ci.txt
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  python3 -m pip install --user -r requirements-ci.txt
  python3 -m pre_commit install || true

knowledge:
  - name: test
    contents: |
      python3 -m pytest
      Tests mock IMAP/external services; no .env is required for test runs.
  - name: lint
    contents: |
      python3 -m pre_commit run --all-files
      Use requirements-ci.txt to avoid optional multi-GB ML dependencies.
  - name: run
    contents: |
      cp -n .env.example .env
      python3 src/main.py
      Runtime IMAP credentials are required for the full pipeline.
---
runs-on: macos
initialize: |
  mkdir -p "$HOME/.venvs"
  /opt/homebrew/bin/python3.12 -m venv "$HOME/.venvs/email-security-pipeline"

maintenance: |
  "$HOME/.venvs/email-security-pipeline/bin/python" -m pip install pre-commit==4.3.0
  "$HOME/.venvs/email-security-pipeline/bin/python" -m pre_commit install --install-hooks --overwrite || true

knowledge:
  - name: lint
    contents: |
      "$HOME/.venvs/email-security-pipeline/bin/python" -m pre_commit run --all-files
      The repository pin for pre-commit 4.6.2 is unavailable; use verified 4.3.0 on macOS.
